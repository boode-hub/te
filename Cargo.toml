[package]
name = "te"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "accesskit", "wgpu"] }
md-5 = "0.11.0"
memchr = "2.8.3"
memmap2 = "0.9.12"
regex = "1.13.1"
rfd = "0.17.2"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
skrifa = { version = "0.44", default-features = false }
sqlformat = "0.5.0"
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
resvg = "0.45"
winresource = "0.1"
